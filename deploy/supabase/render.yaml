services:
- type: pserv
  name: logisticsnerd-standalone-db
  runtime: docker
  region: virginia
  plan: 1c-2g
  numInstances: 1
  autoDeployTrigger: 'off'
  dockerfilePath: deploy/supabase/images/db.Dockerfile
  dockerContext: .
  envVars:
  - &id001
    key: POSTGRES_PORT
    value: '5432'
  - &id002
    key: POSTGRES_DB
    value: postgres
  - &id003
    key: APP_DB_NAME
    value: logistics
  - &id004
    key: APP_ALLOW_DATABASE_CREATE
    value: 'false'
  - &id005
    key: DASHBOARD_USERNAME
    value: supabase
  - &id006
    key: SUPABASE_DB_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-db
      property: host
  - &id007
    key: SUPABASE_GATEWAY_HOST
    fromService:
      type: web
      name: logisticsnerd-standalone-api-gw
      property: host
  - &id008
    key: SUPABASE_PUBLIC_URL
    fromService:
      type: web
      name: logisticsnerd-standalone-api-gw
      envVarKey: RENDER_EXTERNAL_URL
  - &id009
    key: APP_ORIGIN
    fromService:
      type: web
      name: logisticsnerd-standalone-app
      envVarKey: RENDER_EXTERNAL_URL
  - &id010
    key: SUPABASE_AUTH_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-auth
      property: host
  - &id011
    key: SUPABASE_REST_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-rest
      property: host
  - &id012
    key: SUPABASE_REALTIME_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-realtime
      property: host
  - &id013
    key: SUPABASE_STORAGE_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-storage
      property: host
  - &id014
    key: SUPABASE_META_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-meta
      property: host
  - &id015
    key: SUPABASE_STUDIO_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-studio
      property: host
  - &id016
    key: SUPABASE_FUNCTIONS_HOST
    fromService:
      type: pserv
      name: logisticsnerd-standalone-functions
      property: host
  - key: POSTGRES_PASSWORD
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: ANON_KEY
    sync: false
  - key: SERVICE_ROLE_KEY
    sync: false
  - key: DASHBOARD_PASSWORD
    sync: false
  - key: SECRET_KEY_BASE
    sync: false
  - key: REALTIME_DB_ENC_KEY
    sync: false
  - key: VAULT_ENC_KEY
    sync: false
  - key: PG_META_CRYPTO_KEY
    sync: false
  - key: S3_PROTOCOL_ACCESS_KEY_ID
    sync: false
  - key: S3_PROTOCOL_ACCESS_KEY_SECRET
    sync: false
  - key: APP_DB_PASSWORD
    sync: false
  - key: PORT
    value: '5432'
  disk:
    name: logisticsnerd-standalone-pgdata
    mountPath: /var/lib/postgresql
    sizeGB: 40
